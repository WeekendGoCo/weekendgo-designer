<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WeekendGo · Tour Designer v2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== LIGHT MODE BRAND VARIABLES (brand_light.md) ===== */
:root {
  /* Dark mode shell */
  --wg-navy:#0A1628; --wg-navy-mid:#0D1F3C;
  --wg-blue:#0094D4; --wg-green:#8CC63F; --wg-cyan:#1AAFCF;
  --wg-gold:#C9A227; --wg-neon:#00ADEF; --wg-lime:#39FF14;
  --wg-glass:rgba(255,255,255,0.06); --wg-border:rgba(255,255,255,0.12);
  --glow-b:0 0 8px #00ADEF,0 0 24px rgba(0,173,239,0.3);
  --glow-g:0 0 8px #8CC63F,0 0 24px rgba(140,198,63,0.3);
  /* Input */
  --inp-bg:rgba(255,255,255,0.05); --inp-bd:rgba(255,255,255,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#060E1C;color:#fff;min-height:100vh;overflow-x:hidden}

/* ===== SHELL ===== */
.shell{display:grid;grid-template-columns:340px 1fr;grid-template-rows:64px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:var(--wg-navy);border-bottom:1px solid var(--wg-border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:300}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-logo{height:44px;width:auto;object-fit:contain}
.tb-title{font-size:12px;color:rgba(255,255,255,0.4);font-weight:400}
.tb-actions{display:flex;gap:8px}

/* ===== SIDEBAR ===== */
.sidebar{background:#0B1A2E;border-left:1px solid var(--wg-border);overflow-y:auto;padding:16px 14px 40px}
.preview-pane{background:#050D1A;overflow-y:auto}

/* SECTION */
.ss{margin-bottom:22px}
.ss-title{font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:.5px solid var(--wg-border)}
.sr{margin-bottom:9px}
.sl{font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.sl .hint{font-size:10px;color:rgba(0,173,239,0.6);background:rgba(0,173,239,0.08);border:1px solid rgba(0,173,239,0.2);border-radius:4px;padding:1px 6px;font-weight:500}
.si,.sta,.sse{width:100%;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:8px;color:#fff;font-family:'Cairo',sans-serif;padding:8px 10px;font-size:13px;outline:none;transition:border-color .2s}
.si:focus,.sta:focus,.sse:focus{border-color:var(--wg-neon)}
.sta{resize:vertical;min-height:72px;line-height:1.6}
.sse option{background:var(--wg-navy)}
.sr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}

/* Image upload */
.img-up{width:100%;background:var(--inp-bg);border:1px dashed var(--inp-bd);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s;text-align:center}
.img-up:hover{border-color:var(--wg-neon)}
.img-up img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.img-up-inner{position:relative;z-index:1;padding:12px 8px;pointer-events:none}
.img-up-icon{font-size:22px;margin-bottom:4px;display:block}
.img-up-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:3px}
.img-up-dim{font-size:10px;color:rgba(0,173,239,0.7);background:rgba(0,173,239,0.08);border:1px solid rgba(0,173,239,0.2);border-radius:4px;padding:2px 7px;display:inline-block;direction:ltr}
.img-up-note{font-size:10px;color:rgba(255,255,255,0.3);margin-top:3px}
.img-up input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* Day tabs */
.day-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px}
.day-tab{background:var(--inp-bg);border:1px solid var(--inp-bd);color:rgba(255,255,255,0.4);border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .15s}
.day-tab.active{background:rgba(0,173,239,0.15);border-color:var(--wg-neon);color:var(--wg-neon)}
.day-tab:hover:not(.active){color:#fff;border-color:rgba(255,255,255,0.3)}
.day-ctrl{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.day-ctrl span{font-size:12px;color:rgba(255,255,255,0.4);flex:1}
.day-ctrl button{width:26px;height:26px;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:6px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif}
.day-ctrl button:hover{border-color:var(--wg-neon);color:var(--wg-neon)}
.day-ctrl-val{font-size:14px;font-weight:700;color:#fff;min-width:22px;text-align:center}

/* Hotel item */
.hotel-item{background:rgba(255,255,255,0.03);border:.5px solid var(--wg-border);border-radius:10px;padding:12px;margin-bottom:10px}
.hi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hi-head span{font-size:12px;font-weight:700;color:var(--wg-cyan)}

/* Stars */
.stars-ctrl{display:flex;gap:2px}
.star-btn{font-size:17px;cursor:pointer;color:rgba(255,255,255,0.2);background:none;border:none;transition:color .1s;padding:0;line-height:1}
.star-btn.on{color:var(--wg-gold)}

/* Incl list */
.incl-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px}
.incl-item input{flex:1;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:6px;color:#fff;padding:5px 8px;font-size:12px;font-family:'Cairo',sans-serif;outline:none}
.incl-type{background:rgba(0,173,239,0.1);border:1px solid rgba(0,173,239,0.25);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--wg-cyan);white-space:nowrap;cursor:pointer;user-select:none;flex-shrink:0}
.incl-type.x{background:rgba(255,70,70,0.1);border-color:rgba(255,70,70,0.25);color:rgba(255,130,130,0.9)}

/* Optional tour */
.opt-item{background:rgba(255,255,255,0.03);border:.5px solid var(--wg-border);border-radius:10px;padding:12px;margin-bottom:10px}

/* Buttons */
.add-btn{width:100%;background:rgba(0,173,239,0.06);border:1px dashed rgba(0,173,239,0.3);color:var(--wg-cyan);border-radius:8px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;margin-top:4px}
.add-btn:hover{background:rgba(0,173,239,0.12)}
.del-btn{background:rgba(255,50,50,0.1);border:1px solid rgba(255,50,50,0.25);color:rgba(255,120,120,0.9);border-radius:5px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.del-btn:hover{background:rgba(255,50,50,0.2)}
.btn-export{background:linear-gradient(135deg,#0094D4,#00ADEF);border:none;color:#fff;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:opacity .2s;white-space:nowrap}
.btn-export:hover{opacity:.85}
.btn-export:disabled{opacity:.5;cursor:wait}
.btn-refresh{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer;font-family:'Cairo',sans-serif}

/* Mobile responsive */
@media(max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:64px auto auto}
  .sidebar{border-left:none;border-top:1px solid var(--wg-border);order:3}
  .preview-pane{order:2;min-height:60vh}
}
</style>
</head>

initDays(10); initHotels();

// ============================================================
// RENDER SIDEBAR COMPONENTS
// ============================================================
function renderIncl(){
  document.getElementById('incl-list').innerHTML=S.includes.map((x,i)=>`
    <div class="incl-item">
      <span class="incl-type ${x.i?'':'x'}" onclick="toggleIncl(${i})">${x.i?'يشمل':'لا يشمل'}</span>
      <input type="text" value="${esc(x.t)}" oninput="S.includes[${i}].t=this.value;liveSync()">
      <button class="del-btn" onclick="S.includes.splice(${i},1);renderIncl();liveSync()">×</button>
    </div>`).join('');
}

function renderDayTabs(){
  document.getElementById('day-cv').textContent=S.days;
  document.getElementById('day-tabs').innerHTML=S.daysList.map((d,i)=>`
    <button class="day-tab ${i===S.activeDayIdx?'active':''}" onclick="setDay(${i})">${i+1}</button>`).join('');
}
function setDay(i){S.activeDayIdx=i;renderDayTabs();renderDayEd();}
function renderDayEd(){
  const d=S.daysList[S.activeDayIdx], i=S.activeDayIdx;
  document.getElementById('day-ed').innerHTML=`
    <div class="sr"><label class="sl">عنوان اليوم ${i+1}</label>
      <input class="si" value="${esc(d.title)}" oninput="S.daysList[${i}].title=this.value;liveSync()">
    </div>
    <div class="sr"><label class="sl">الموقع / المسار</label>
      <input class="si" value="${esc(d.loc)}" oninput="S.daysList[${i}].loc=this.value;liveSync()">

      <div class="img-up" id="di-${i}" style="aspect-ratio:3/2">
        ${d.img?`<img src="${d.img}">`:''}

function chgDays(d){
  const n=Math.min(30,Math.max(1,S.days+d));
  S.days=n; document.getElementById('f-days').value=n;
  if(n>S.daysList.length) for(let i=S.daysList.length;i<n;i++) S.daysList.push({title:'اليوم '+(i+1),loc:'',desc:'',img:null});
  else{ S.daysList=S.daysList.slice(0,n); if(S.activeDayIdx>=n) S.activeDayIdx=n-1; }
  renderDayTabs(); renderDayEd(); liveSync();
}

// ============================================================
// IMAGE HANDLER
// ============================================================
function handleImg(e,type,idx){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    if(type==='cover'){
      S.coverImg=src;
      const box=document.getElementById('cover-box');
      let img=box.querySelector('img');
      if(!img){img=document.createElement('img');box.appendChild(img);}
      img.src=src;
      box.querySelector('.img-up-inner') && (box.querySelector('.img-up-inner').style.display='none');
    } else if(type==='day'){
      S.daysList[idx].img=src; renderDayEd();
    } else if(type==='hotel'){
      S.hotels[idx].img=src; renderHotels();
    }
    liveSync();
  };
  r.readAsDataURL(f);
}

function liveSync(){
  S.badge=v('f-badge'); S.country=v('f-country'); S.cities=v('f-cities');
  S.days=+v('f-days')||S.days; S.nights=+v('f-nights')||S.nights;
  S.price=v('f-price'); S.priceBefore=v('f-price-before');
  S.clientName=v('f-client-name'); S.clientPhone=v('f-client-phone');
  S.wa=v('f-wa'); S.email=v('f-email'); S.web=v('f-web');
  syncPreview();
}

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* LIGHT MODE + DARK GLASS BRAND */
:root{--n:#0A1628;--b:#0094D4;--g:#8CC63F;--c:#1AAFCF;--go:#C9A227;--ne:#00ADEF;--li:#A6CE39;
  --gl:rgba(255,255,255,0.06);--gb:rgba(255,255,255,0.12);
  --gb2:0 0 8px #00ADEF,0 0 24px rgba(0,173,239,0.3);
  --gg:0 0 8px #8CC63F,0 0 24px rgba(140,198,63,0.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--n);color:#fff;font-size:14px;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* HEADER */
.p-header{background:rgba(10,22,40,0.95);border-bottom:1px solid var(--gb);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px)}
.p-logo{height:50px;width:auto;object-fit:contain}
.p-contact{text-align:left;font-size:12px;color:rgba(255,255,255,0.5)}
.p-contact a{color:var(--g);text-decoration:none;font-weight:600;font-size:13px;text-shadow:var(--gg);direction:ltr}

/* COVER PAGE */
.cover-page{min-height:100vh;display:flex;flex-direction:column;${coverBg};position:relative}
.cover-overlay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.badge-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(140,198,63,0.18);border:1.5px solid var(--g);color:var(--g);border-radius:100px;padding:7px 20px;font-size:13px;font-weight:700;margin-bottom:20px;text-shadow:var(--gg);letter-spacing:.5px}
.cover-country{font-size:56px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1;margin-bottom:16px;text-shadow:0 4px 30px rgba(0,0,0,0.5)}
/* CITY CHIPS - phosphor style */
.city-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.city-chip{background:rgba(0,229,255,0.12);border:1.5px solid rgba(0,229,255,0.5);color:#00E5FF;border-radius:100px;padding:7px 20px;font-size:15px;font-weight:800;letter-spacing:.5px;text-shadow:0 0 12px rgba(0,229,255,0.6),0 0 30px rgba(0,229,255,0.3)}
.dur-chip{display:inline-block;background:rgba(57,255,20,0.12);border:1.5px solid rgba(57,255,20,0.45);color:#A6CE39;border-radius:100px;padding:6px 18px;font-size:14px;font-weight:700;letter-spacing:.3px;text-shadow:0 0 10px rgba(57,255,20,0.4);margin-bottom:20px}

/* CLIENT DEDICATION */
.client-dedication{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:16px 24px;text-align:center;margin-top:16px;backdrop-filter:blur(8px)}
.client-ded-label{font-size:12px;color:rgba(255,255,255,0.6);font-weight:400;margin-bottom:6px;letter-spacing:1px}
.client-ded-name{font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px}
.client-ded-phone{font-size:16px;color:var(--c);font-weight:500;direction:ltr;margin-top:2px}

/* PRICE BOX */
.price-box{background:rgba(0,173,239,0.1);border:1px solid rgba(0,173,239,0.3);border-radius:14px;padding:12px 28px;margin-top:20px;display:inline-block}
.price-before{font-size:14px;color:rgba(255,255,255,0.4);text-decoration:line-through;direction:ltr}
.price-main{font-size:36px;font-weight:900;color:#fff;direction:ltr;letter-spacing:-1px;text-shadow:var(--gb2)}

/* PAGE CONTENT */
.page{max-width:800px;margin:0 auto;padding:28px 18px 60px;position:relative;z-index:1}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(5,10,20,0.7) 100%);pointer-events:none;z-index:0}

/* SECTION HEADING */
.sec-head{display:flex;align-items:center;gap:12px;margin:28px 0 14px}
.sec-head h2{font-size:13px;font-weight:800;color:var(--ne);text-shadow:var(--gb2);white-space:nowrap;letter-spacing:1.5px}
.sec-line{flex:1;height:.5px;background:linear-gradient(to left,transparent,rgba(0,173,239,0.4))}

/* GLASS CARD */
.glass-card{background:var(--gl);backdrop-filter:blur(20px);border:.5px solid var(--gb);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:10px}

/* INCL/EXCL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.incl-list li,.excl-list li{list-style:none;display:flex;align-items:flex-start;gap:8px;font-size:13px;color:rgba(255,255,255,0.82);margin-bottom:7px;line-height:1.5;font-weight:400}
.incl-list li::before{content:'✓';color:var(--g);font-weight:700;font-size:12px;text-shadow:var(--gg);flex-shrink:0;margin-top:2px}
.excl-list li::before{content:'×';color:rgba(255,80,80,0.8);font-weight:700;font-size:14px;flex-shrink:0;margin-top:1px}

/* DAY CARDS */
.day-card{background:var(--gl);border:.5px solid var(--gb);border-radius:18px;margin-bottom:10px;overflow:hidden}
.day-header{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:.5px solid rgba(255,255,255,0.06)}
.day-num{width:38px;height:38px;border-radius:10px;background:rgba(0,148,212,0.15);border:1px solid rgba(0,148,212,0.35);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--ne);text-shadow:var(--gb2);flex-shrink:0;direction:ltr}
.day-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:2px}
.day-loc{font-size:11px;color:var(--c);font-weight:500}
.day-img-wrap{width:100%;height:190px;overflow:hidden}
.day-img{width:100%;height:100%;object-fit:cover}
.day-body{padding:16px 20px;font-size:13px;color:rgba(255,255,255,0.72);line-height:1.85;font-weight:300}

/* HOTELS */
.hotels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.hcard{background:var(--gl);border:.5px solid var(--gb);border-radius:14px;overflow:hidden}
.hcard-img{width:100%;height:130px;overflow:hidden}
.hcard-img img{width:100%;height:100%;object-fit:cover}
.hcard-noimg{display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(255,255,255,0.04)}
.hcard-body{padding:12px 14px}
.hcard-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:6px}
.hcard-meta{display:flex;align-items:center;gap:8px}
.hcard-stars{color:var(--go);font-size:13px;letter-spacing:1px}
.hcard-nights{font-size:12px;color:var(--c);font-weight:600}

/* OPTIONAL */
.opt-row{padding:13px 0;border-bottom:.5px solid rgba(255,255,255,0.07)}
.opt-row:last-child{border-bottom:none;padding-bottom:0}
.opt-title{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.opt-desc{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:3px;font-weight:300}
.opt-price{font-size:13px;color:var(--go);font-weight:700}

/* FOOTER */
.p-footer{background:linear-gradient(to bottom,rgba(0,148,212,0.1),rgba(10,22,40,0));border-top:1px solid rgba(0,148,212,0.25);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:32px}
.p-footer-tag{font-size:14px;font-weight:700;color:rgba(255,255,255,0.85)}
.p-footer-contact{display:flex;flex-direction:column;gap:3px;font-size:12px;color:rgba(255,255,255,0.5);text-align:left}
.p-footer-contact a{color:var(--g);text-decoration:none;direction:ltr}
.fbadges{display:flex;gap:6px;flex-wrap:wrap}
.fbadge{background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.12);border-radius:6px;padding:3px 10px;font-size:10px;color:rgba(255,255,255,0.5);font-weight:600}
.fbadge.g{border-color:rgba(140,198,63,0.3);color:var(--g);background:rgba(140,198,63,0.08)}

@media(max-width:600px){
  .two-col{grid-template-columns:1fr}
  .cover-country{font-size:38px}
  .city-chip{font-size:13px;padding:6px 16px}
  .hotels-grid{grid-template-columns:1fr 1fr}
  .p-footer{flex-direction:column;text-align:center}
  .p-header{padding:12px 16px}
  .p-footer-contact{text-align:center}
}

/* PDF print styles */
@media print{
  .cover-page{min-height:100vh;page-break-after:always}
  .day-card{page-break-inside:avoid}
  .hcard{page-break-inside:avoid}
}
</style>
</head>

// ============================================================
// EXPORT PDF — uses print dialog (100% reliable, no library needed)
// ============================================================
function exportPDF(){
  const btn=document.getElementById('exp-btn');
  btn.textContent='⏳ جاري التحضير...';
  btn.disabled=true;

  const html = buildHTML(true);
  const w = window.open('','_blank','width=420,height=800');
  if(!w){
    alert('الرجاء السماح بالنوافذ المنبثقة في المتصفح ثم حاول مرة أخرى');
    btn.textContent='⬇ تصدير PDF'; btn.disabled=false; return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
  
  setTimeout(()=>{
    w.focus();
    w.print();
    btn.textContent='⬇ تصدير PDF'; btn.disabled=false;
  }, 1800);
}

// ============================================================
// SYNC PREVIEW
// ============================================================
function syncPreview(){
  document.getElementById('preview-out').innerHTML = buildHTML(false);
}

// ============================================================
// UTILS
// ============================================================
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
// INIT
// ============================================================
renderIncl();

renderHotels();

syncPreview();

// Auto-sync on every keyup in sidebar
